              🎵 Open our playlist
            </a>
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1vxNhqYP5JBJzf4NQxKm84?utm_source=generator" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify playlist"></iframe>
          </div>
        </div>
      </section>

      <section class="card ring" aria-labelledby="memories-title">
        <div class="letter">
          <h2 id="memories-title">Our little gallery</h2>
          <div class="images">
            <figure>
              <img src="kvGYigtKmZN5AGZRmfpN2.png" alt="Two Transformice avatars..." />
